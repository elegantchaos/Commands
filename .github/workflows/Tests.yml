name: "Tests"

on: [push, pull_request]

jobs:
  iOS-swift64:
    name: "iOS (Swift 6.4, Xcode matching Swift 6.4)"
    uses: ./.github/workflows/ActionBuilderXcodeJob.yml
    with:
      package: "Commands"
      platform: "iOS"
      runner: "xcode-27"
      swift-version: "6.4"
      compiler-id: "swift64"
      preferred-xcode-version: "27.0"
      setup-mode: "xcode-release"
      operation: "test"

  macOS-swift64:
    name: "macOS (Swift 6.4)"
    uses: ./.github/workflows/ActionBuilderSwiftJob.yml
    with:
      platform: "macOS"
      runner: "xcode-27"
      swift-version: "6.4"
      compiler-id: "swift64"
      setup-mode: "release"
      operation: "test"

  watchOS-swift64:
    name: "watchOS (Swift 6.4, Xcode matching Swift 6.4)"
    uses: ./.github/workflows/ActionBuilderXcodeJob.yml
    with:
      package: "Commands"
      platform: "watchOS"
      runner: "xcode-27"
      swift-version: "6.4"
      compiler-id: "swift64"
      preferred-xcode-version: "27.0"
      setup-mode: "xcode-release"
      operation: "build"
